<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SWAGS Classes</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --navy: #0a1628;
      --gold: #c9a84c;
      --gold-light: #f0d080;
      --cream: #fdf6e3;
      --white: #ffffff;
    }

    body {
      background-color: var(--navy);
      font-family: 'Poppins', sans-serif;
      color: var(--white);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── Background Stars ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(1px 1px at 10% 15%, rgba(201,168,76,0.4) 0%, transparent 100%),
        radial-gradient(1px 1px at 25% 40%, rgba(255,255,255,0.3) 0%, transparent 100%),
        radial-gradient(1px 1px at 50% 10%, rgba(201,168,76,0.3) 0%, transparent 100%),
        radial-gradient(1px 1px at 70% 30%, rgba(255,255,255,0.2) 0%, transparent 100%),
        radial-gradient(1px 1px at 85% 60%, rgba(201,168,76,0.3) 0%, transparent 100%),
        radial-gradient(1px 1px at 95% 20%, rgba(255,255,255,0.3) 0%, transparent 100%),
        radial-gradient(1px 1px at 40% 75%, rgba(201,168,76,0.2) 0%, transparent 100%),
        radial-gradient(1px 1px at 60% 85%, rgba(255,255,255,0.2) 0%, transparent 100%);
      pointer-events: none;
      z-index: 0;
    }

    /* ── Header ── */
    header {
      position: relative;
      z-index: 10;
      text-align: center;
      padding: 50px 20px 30px;
      background: linear-gradient(180deg, rgba(10,22,40,0.95) 0%, transparent 100%);
    }

    .logo-container {
      display: inline-block;
      position: relative;
      margin-bottom: 18px;
      animation: fadeDown 0.8s ease both;
    }

    .logo-container::before {
      content: '';
      position: absolute;
      inset: -12px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(201,168,76,0.25) 0%, transparent 70%);
      animation: pulse 3s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.7; }
      50% { transform: scale(1.08); opacity: 1; }
    }

    .logo-container img {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: contain;
      border: 3px solid var(--gold);
      box-shadow: 0 0 30px rgba(201,168,76,0.5), 0 0 60px rgba(201,168,76,0.2);
      background: var(--white);
      padding: 6px;
      position: relative;
      z-index: 1;
    }

    .brand-name {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2rem, 8vw, 3.2rem);
      font-weight: 900;
      color: var(--gold);
      letter-spacing: 3px;
      text-transform: uppercase;
      line-height: 1;
      animation: fadeDown 0.8s 0.15s ease both;
      text-shadow: 0 0 30px rgba(201,168,76,0.4);
    }

    .brand-tagline {
      font-size: clamp(0.7rem, 3vw, 0.95rem);
      font-weight: 300;
      color: rgba(255,255,255,0.65);
      letter-spacing: 5px;
      text-transform: uppercase;
      margin-top: 6px;
      animation: fadeDown 0.8s 0.3s ease both;
    }

    .gold-divider {
      width: 80px;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      margin: 20px auto;
      animation: fadeDown 0.8s 0.45s ease both;
    }

    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Section Title ── */
    .section-title {
      text-align: center;
      margin: 20px 0 35px;
      position: relative;
      z-index: 10;
      animation: fadeUp 0.8s 0.5s ease both;
    }

    .section-title h2 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.4rem, 5vw, 2rem);
      color: var(--gold-light);
      font-weight: 700;
      letter-spacing: 2px;
    }

    .section-title p {
      font-size: 0.82rem;
      color: rgba(255,255,255,0.45);
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-top: 5px;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Gallery Grid ── */
    .gallery {
      position: relative;
      z-index: 10;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      padding: 0 24px 60px;
      max-width: 1100px;
      margin: 0 auto;
    }

    .gallery-item {
      position: relative;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid rgba(201,168,76,0.25);
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      cursor: pointer;
      animation: fadeUp 0.8s ease both;
      transition: transform 0.35s ease, box-shadow 0.35s ease, border-color 0.35s ease;
      aspect-ratio: 4/3;
      background: rgba(255,255,255,0.04);
    }

    .gallery-item:nth-child(1) { animation-delay: 0.55s; }
    .gallery-item:nth-child(2) { animation-delay: 0.70s; }
    .gallery-item:nth-child(3) { animation-delay: 0.85s; }

    .gallery-item:hover {
      transform: translateY(-6px) scale(1.02);
      box-shadow: 0 20px 50px rgba(0,0,0,0.6), 0 0 30px rgba(201,168,76,0.2);
      border-color: rgba(201,168,76,0.6);
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.5s ease;
    }

    .gallery-item:hover img {
      transform: scale(1.06);
    }

    .gallery-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, transparent 50%, rgba(10,22,40,0.85) 100%);
      opacity: 0;
      transition: opacity 0.35s ease;
      display: flex;
      align-items: flex-end;
      padding: 16px;
    }

    .gallery-item:hover .gallery-overlay {
      opacity: 1;
    }

    .gallery-overlay span {
      font-size: 0.8rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--gold-light);
      font-weight: 600;
    }

    /* ── Lightbox ── */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(5,10,20,0.96);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
      animation: fadeIn 0.3s ease;
    }

    .lightbox.active { display: flex; }

    @keyframes fadeIn {
      from { opacity: 0; } to { opacity: 1; }
    }

    .lightbox img {
      max-width: 92vw;
      max-height: 80vh;
      border-radius: 12px;
      border: 2px solid rgba(201,168,76,0.4);
      box-shadow: 0 0 60px rgba(201,168,76,0.15);
      object-fit: contain;
    }

    .lightbox-close {
      position: absolute;
      top: 20px;
      right: 24px;
      background: rgba(201,168,76,0.15);
      border: 1px solid rgba(201,168,76,0.4);
      color: var(--gold);
      width: 42px;
      height: 42px;
      border-radius: 50%;
      font-size: 1.3rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .lightbox-close:hover { background: rgba(201,168,76,0.35); }

    .lightbox-nav {
      display: flex;
      gap: 16px;
    }

    .lightbox-nav button {
      background: rgba(201,168,76,0.15);
      border: 1px solid rgba(201,168,76,0.35);
      color: var(--gold);
      padding: 10px 24px;
      border-radius: 30px;
      cursor: pointer;
      font-family: 'Poppins', sans-serif;
      font-size: 0.85rem;
      letter-spacing: 1px;
      transition: background 0.2s, transform 0.2s;
    }

    .lightbox-nav button:hover {
      background: rgba(201,168,76,0.3);
      transform: scale(1.05);
    }

    /* ── Footer ── */
    footer {
      position: relative;
      z-index: 10;
      text-align: center;
      padding: 24px 20px;
      border-top: 1px solid rgba(201,168,76,0.15);
      color: rgba(255,255,255,0.3);
      font-size: 0.75rem;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    footer span { color: var(--gold); }

    /* ── Responsive ── */
    @media (max-width: 480px) {
      .gallery { grid-template-columns: 1fr; padding: 0 16px 50px; }
      .logo-container img { width: 90px; height: 90px; }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="logo-container">
      <img src="logo.png" alt="SWAGS Classes Logo" onerror="this.style.display='none'"/>
    </div>
    <div class="brand-name">SWAGS Classes</div>
    <div class="brand-tagline">Excellence in Education</div>
    <div class="gold-divider"></div>
  </header>

  <!-- Gallery Title -->
  <div class="section-title">
    <h2>Our Gallery</h2>
    <p>Moments &amp; Memories</p>
  </div>

  <!-- Photo Gallery -->
  <div class="gallery" id="gallery">
    <div class="gallery-item" onclick="openLightbox(0)">
      <img src="photo1.jpg" alt="SWAGS Classes Photo 1" loading="lazy"/>
      <div class="gallery-overlay"><span>View Photo</span></div>
    </div>
    <div class="gallery-item" onclick="openLightbox(1)">
      <img src="photo2.jpg" alt="SWAGS Classes Photo 2" loading="lazy"/>
      <div class="gallery-overlay"><span>View Photo</span></div>
    </div>
    <div class="gallery-item" onclick="openLightbox(2)">
      <img src="photo3.jpg" alt="SWAGS Classes Photo 3" loading="lazy"/>
      <div class="gallery-overlay"><span>View Photo</span></div>
    </div>
  </div>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" onclick="closeLightbox()">✕</button>
    <img id="lightbox-img" src="" alt="Full View"/>
    <div class="lightbox-nav">
      <button onclick="changeLightbox(-1)">← Prev</button>
      <button onclick="changeLightbox(1)">Next →</button>
    </div>
  </div>

  <!-- Footer -->
  <footer>
    &copy; 2026 <span>SWAGS Classes</span> &nbsp;|&nbsp; All Rights Reserved
  </footer>

  <script>
    const photos = ['photo1.jpg', 'photo2.jpg', 'photo3.jpg'];
    let current = 0;

    function openLightbox(index) {
      current = index;
      document.getElementById('lightbox-img').src = photos[current];
      document.getElementById('lightbox').classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('active');
      document.body.style.overflow = '';
    }

    function changeLightbox(dir) {
      current = (current + dir + photos.length) % photos.length;
      const img = document.getElementById('lightbox-img');
      img.style.opacity = '0';
      setTimeout(() => {
        img.src = photos[current];
        img.style.opacity = '1';
      }, 200);
    }

    img_el = document.getElementById('lightbox-img');
    img_el.style.transition = 'opacity 0.2s ease';

    // Close lightbox on background click
    document.getElementById('lightbox').addEventListener('click', function(e) {
      if (e.target === this) closeLightbox();
    });

    // Keyboard navigation
    document.addEventListener('keydown', function(e) {
      if (!document.getElementById('lightbox').classList.contains('active')) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowLeft') changeLightbox(-1);
      if (e.key === 'ArrowRight') changeLightbox(1);
    });
  </script>
</body>
</html>
